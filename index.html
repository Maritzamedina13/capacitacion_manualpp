<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruta del Manual de Prácticas Profesionales ITM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="js/styles.css" />
  <style>
    /* Responsive base */
    *, *::before, *::after { box-sizing: border-box; }
    img { max-width: 100%; height: auto; }
    input, button, select { max-width: 100%; }

    @media (max-width: 860px) {
      .welcome-grid, .intro-grid { grid-template-columns: 1fr !important; }
      .welcome-badges { display: none !important; }
    }

    /* Mapa: nodos de texto no desbordantes */
    @media (max-width: 768px) {
      .map-node-text { font-size: 11px !important; max-width: 110px !important; }
      /* Header mapa: logo arriba, fila abajo */
      .map-header { flex-direction: column !important; align-items: center !important; gap: 8px !important; }
      .map-logo-center { position: static !important; transform: none !important; order: -1 !important; }
    }

    /* Módulos: intro se apila */
    @media (max-width: 640px) {
      .intro-grid { grid-template-columns: 1fr !important; }
      .welcome-form-row { flex-direction: column !important; }
      .welcome-form-row > * { width: 100% !important; }
    }

    /* Certificado sin aspect-ratio en móvil */
    @media (max-width: 768px) {
      .cert-card { aspect-ratio: unset !important; height: auto !important; overflow: visible !important; }
      .cert-badges { flex-wrap: wrap !important; gap: 5px !important; justify-content: center !important; }
    }

    /* Touch targets mínimos */
    @media (hover: none) {
      .btn { min-height: 44px; min-width: 44px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (versiones fijadas) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Datos (JS plano) -->
  <script src="js/content.js?v=16"></script>
  <script src="js/quizzes.js?v=16"></script>

  <!-- Componentes y pantallas (JSX) -->
  <script type="text/babel" src="js/components.jsx?v=16"></script>
  <script type="text/babel" src="js/presentation.jsx?v=16"></script>
  <script type="text/babel" src="js/welcome.jsx?v=16"></script>
  <script type="text/babel" src="js/map.jsx?v=16"></script>
  <script type="text/babel" src="js/quiz.jsx?v=16"></script>
  <script type="text/babel" src="js/module.jsx?v=16"></script>
  <script type="text/babel" src="js/certificate.jsx?v=16"></script>
  <script type="text/babel" src="js/app.jsx?v=16"></script>
</body>
</html>
